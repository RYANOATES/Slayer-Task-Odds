<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="250" viewBox="0 0 1280 250" role="img" aria-labelledby="title desc">
  <title id="title">Sync, select, compare</title>
  <desc id="desc">One: open Slayer rewards, Tasks to sync blocks. Two: select a task and view its portrait. Three: compare masters ranked by assignment chance.</desc>
  <rect width="1280" height="250" rx="14" fill="#1b0c11"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <g transform="translate(24 24)">
      <rect width="394" height="202" rx="10" fill="#2b1318" stroke="#a67c30"/>
      <circle cx="38" cy="42" r="19" fill="#412319" stroke="#f4cf69"/>
      <text x="38" y="49" text-anchor="middle" fill="#f4cf69" font-size="20" font-weight="700">1</text>
      <text x="72" y="50" fill="#f6e6c6" font-size="25" font-weight="700">Sync your blocks</text>
      <text x="24" y="101" fill="#e1d3be" font-size="19">Open Slayer rewards → Tasks.</text>
      <text x="24" y="132" fill="#c1af9d" font-size="17">The selected master's block list</text>
      <text x="24" y="158" fill="#c1af9d" font-size="17">is read and saved automatically.</text>
    </g>
    <g transform="translate(443 24)">
      <rect width="394" height="202" rx="10" fill="#2b1318" stroke="#a67c30"/>
      <circle cx="38" cy="42" r="19" fill="#412319" stroke="#f4cf69"/>
      <text x="38" y="49" text-anchor="middle" fill="#f4cf69" font-size="20" font-weight="700">2</text>
      <text x="72" y="50" fill="#f6e6c6" font-size="25" font-weight="700">Choose a task</text>
      <text x="24" y="101" fill="#e1d3be" font-size="19">Select a monster from the dropdown.</text>
      <text x="24" y="132" fill="#c1af9d" font-size="17">Its portrait appears beneath the selector.</text>
      <text x="24" y="158" fill="#c1af9d" font-size="17">Grouped tasks show one representative.</text>
    </g>
    <g transform="translate(862 24)">
      <rect width="394" height="202" rx="10" fill="#412319" stroke="#f4cf69"/>
      <circle cx="38" cy="42" r="19" fill="#2b1318" stroke="#f4cf69"/>
      <text x="38" y="49" text-anchor="middle" fill="#f4cf69" font-size="20" font-weight="700">3</text>
      <text x="72" y="50" fill="#f6e6c6" font-size="25" font-weight="700">Compare the odds</text>
      <text x="24" y="101" fill="#e1d3be" font-size="19">Highest assignment chance comes first.</text>
      <text x="24" y="132" fill="#c1af9d" font-size="17">Review each master's percentage,</text>
      <text x="24" y="158" fill="#c1af9d" font-size="17">task weight and eligible task count.</text>
    </g>
  </g>
</svg>
