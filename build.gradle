plugins {
    id 'java'
}

repositories {
    mavenLocal()
    maven {
        url = 'https://repo.runelite.net'
        content { includeGroupByRegex("net\\.runelite.*") }
    }
    mavenCentral()
}

def runeLiteVersion = '1.13.6'

dependencies {
    compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
    testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
    testImplementation 'org.mockito:mockito-core:4.11.0'
}

tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'slayertaskodds.SlayerOddsLauncher'
    jvmArgs '-ea'
    args '--developer-mode'
}

group = 'com.slayertaskodds'
version = '2.0.0'

if (project.hasProperty('devBuildDir')) {
    layout.buildDirectory.set(file(project.property('devBuildDir')))
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}






// Runs fixtures generated by the original Wiki Lua, plus block synchronization checks.
tasks.register('verifyWiki', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'slayertaskodds.SlayerOddsVerification'
    jvmArgs '-ea'
}
tasks.named('check') { dependsOn 'verifyWiki' }
